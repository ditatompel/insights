name: Staging

on:
  pull_request:

  # allow triggering workflow manually.
  workflow_dispatch:

jobs:
  deploy:
    name: Build and copy to staging VPS
    runs-on: ubuntu-latest
    if: github.repository_owner == 'turks'
    environment: staging
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install Dart Sass
        run: |
          curl -LJO https://github.com/sass/dart-sass/releases/download/1.100.0/dart-sass-1.100.0-linux-x64.tar.gz
          tar -xzf dart-sass-1.100.0-linux-x64.tar.gz
          cp -r dart-sass/* /usr/local/bin

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.26.x

      - name: Setup Hugo
        run: CGO_ENABLED=1 go install -tags extended github.com/gohugoio/hugo@v0.134.1

      - name: Cache Hugo modules
        uses: actions/cache@v6
        with:
          path: /tmp/hugo_cache
          key: ${{ runner.os }}-hugomod-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-hugomod-

      - name: Build
        run: hugo --minify --gc --enableGitInfo --cleanDestinationDir

